<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HiPaw · 内容工作台</title>
<style>
:root{
  --ink:#17302D; --ink-2:#2B4A46; --paper:#EEF1EC; --surface:#FFFFFF; --line:#D5DCD5; --muted:#5B6D68;
  --iodine:#E0A21A; --iodine-soft:#FBF0D6; --iodine-text:#855600;
  --alert:#B3412E; --alert-soft:#F8E3DE; --ok:#2E7550; --ok-soft:#DFEFE5; --trend:#34508F; --trend-soft:#E4E9F6;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"PingFang SC","HarmonyOS Sans SC","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;font-size:14px;line-height:1.6;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--iodine);outline-offset:2px}
h1,h2,h3,h4{font-weight:600}

.app{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:100vh;background:linear-gradient(to right,var(--ink) 212px,transparent 212px)}
.side{background:var(--ink);color:#E6ECE8;padding:20px 12px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;padding:0 8px}
.brand small{display:block;font-weight:400;font-size:12px;color:#9FB3AD;line-height:1.3}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{background:none;border:0;color:#C9D5D0;text-align:left;padding:9px 12px;border-radius:8px;display:flex;justify-content:space-between;align-items:center}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button[aria-current="page"]{background:var(--paper);color:var(--ink);font-weight:600}
.nav .tag{font-size:11px;padding:0 8px;border-radius:999px;background:rgba(255,255,255,.12);font-weight:400}
.nav button[aria-current="page"] .tag{background:var(--iodine-soft);color:var(--iodine-text)}
.side-foot{margin-top:auto;font-size:12px;color:#8EA39D;padding:0 8px;line-height:1.7}

main{padding:22px 30px 56px;min-width:0}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.topbar h1{font-size:22px;margin:0;letter-spacing:.01em}
.topbar p{margin:2px 0 0;color:var(--muted);font-size:13px}
.role{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 14px;border-radius:7px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.pad{padding:20px 22px}
.pad h3,.tools h3,.inbox h3{font-size:13px;font-weight:500;color:var(--muted);margin:20px 0 8px}
.pad h3:first-child,.tools h3:first-child,.inbox h3:first-child{margin-top:0}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--ink-2)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;font-size:12px;padding:0 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface);white-space:nowrap;line-height:1.8}
.src-case{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.src-season{background:var(--iodine-soft);border-color:transparent;color:var(--iodine-text)}
.src-trend{background:var(--trend-soft);border-color:transparent;color:var(--trend)}
.src-self{background:#ECE6F2;border-color:transparent;color:#5A3E78}
/* 开始创作 */
.create{max-width:860px;margin:0 auto}
.hello{font-size:26px;text-align:center;margin:18px 0 6px;letter-spacing:.02em}
.hello-sub{text-align:center;color:var(--muted);font-size:13.5px;margin:0 0 20px}
.composer{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;padding:16px 16px 12px}
.composer:focus-within{border-color:var(--ink)}
.attach{width:96px;height:96px;border:1.5px dashed #B9C6BF;border-radius:12px;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted);padding:6px;line-height:1.4}
.attach .plus{font-size:22px;line-height:1;color:var(--ink-2)}
.attach.on{border-style:solid;border-color:var(--iodine);background:var(--iodine-soft);color:var(--iodine-text)}
.composer textarea{border:0;min-height:96px;font-size:15px;padding:4px 0;resize:none;outline:none;background:transparent}
.composer-foot{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.composer-foot .hint{margin:0}
.send-err{font-size:12.5px;color:var(--alert)}
.scenes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
.scene{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;font-size:13.5px;line-height:1.45}
.scene:hover{border-color:#AFBDB6}
.scene small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.chat{margin-top:26px;display:flex;flex-direction:column;gap:14px}
.me{align-self:flex-end;background:var(--ink);color:#fff;padding:10px 14px;border-radius:12px 12px 3px 12px;max-width:80%;font-size:14.5px}
.me .chip{margin-left:6px;background:rgba(255,255,255,.14);color:#fff;border-color:transparent}
.agent{padding:18px 20px}
.agent h4{font-size:13px;color:var(--muted);font-weight:500;margin:18px 0 8px}
.agent h4:first-child{margin-top:0}
.match{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;flex-wrap:wrap}
.match b{display:block}
.angles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.angle{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;background:#FAFBF9}
.angle b{font-size:14.5px}
.angle p{margin:0;font-size:13px;color:var(--ink-2)}
.angle .fit{font-size:12px;color:var(--muted)}
.angle .btn{margin-top:auto;align-self:flex-start}
.thinking{padding:16px 20px;color:var(--muted)}
@media (max-width:880px){ .scenes{grid-template-columns:1fr 1fr} .angles{grid-template-columns:1fr} .composer{grid-template-columns:1fr} }
.hint{font-size:12.5px;color:var(--muted);margin:0 0 10px}

/* 选题池 */
.topics{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr);gap:20px;align-items:start}
.filters{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.fbtn{border:1px solid var(--line);background:transparent;padding:3px 12px;border-radius:999px;color:var(--muted);font-size:13px}
.fbtn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.demo-note{margin-left:auto;font-size:12px;color:var(--muted)}
.tlist{overflow:hidden}
.trow{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 16px}
.trow:last-child{border-bottom:0}
.trow:hover{background:#F7F9F6}
.trow[aria-pressed="true"]{background:var(--iodine-soft);box-shadow:inset 3px 0 0 var(--iodine)}
.trow .chip{justify-self:start}
.t-body strong{display:block;font-size:15px}
.signal{font-size:12.5px;color:var(--muted)}
.t-status{font-size:12.5px;color:var(--muted);white-space:nowrap}
.t-status.mine{color:var(--ok);font-weight:600}
.detail{padding:20px 22px;position:sticky;top:20px}
.detail h2{font-size:18px;margin:10px 0 2px;line-height:1.45}
.sub{font-size:13px;color:var(--muted);font-weight:500;margin:22px 0 8px}
.cascade{list-style:none;margin:0 0 0 6px;padding:0 0 0 14px;border-left:2px solid var(--line)}
.cascade li{position:relative;padding:7px 0 7px 12px}
.cascade li::before{content:"";position:absolute;left:-14px;top:19px;width:14px;height:2px;background:var(--line)}
.cascade li strong{font-weight:600;margin-right:6px}
.cascade li span.who{display:block;font-size:12.5px;color:var(--muted)}
.cta{margin-top:22px;display:flex;gap:8px;flex-wrap:wrap}

/* 口播流程 */
.stepper{list-style:none;display:flex;gap:6px;padding:0;margin:0 0 18px;flex-wrap:wrap}
.stepper button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:4px 13px 4px 5px;border-radius:999px;color:var(--muted);font-size:13px}
.stepper .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--paper);font-size:12px;font-variant-numeric:tabular-nums}
.stepper button.done .n{background:var(--ok-soft);color:var(--ok)}
.stepper button[aria-current="step"]{border-color:var(--ink);color:var(--ink);font-weight:600}
.stepper button[aria-current="step"] .n{background:var(--iodine);color:var(--ink)}
.stepper button:disabled{opacity:.5}
.vgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,1fr);gap:20px;align-items:start}
.big{font-size:18px;font-weight:600;margin:0;line-height:1.45}
.case{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer}
.case input{margin-top:5px;accent-color:var(--ink)}
.case small{display:block;color:var(--muted);font-size:12.5px}
.script p{margin:0 0 14px;display:grid;grid-template-columns:60px minmax(0,1fr);gap:12px;line-height:1.9;font-size:15px}
.script .lab{font-size:12px;color:var(--muted);padding-top:5px}
.script .sec{margin:0 0 14px;display:grid;grid-template-columns:60px minmax(0,1fr);gap:12px;line-height:1.9;font-size:15px}
.script .lab em{display:block;font-style:normal;color:var(--iodine-text);font-size:11.5px;line-height:1.4}
.script textarea{width:100%;display:block;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font:inherit;font-size:15px;line-height:1.9;resize:none;background:#FAFBF9;color:var(--ink);overflow:hidden;min-height:44px}
.script textarea:hover{border-color:#AFBDB6}
.script textarea:focus{border-color:var(--ink);background:#fff;outline:none;box-shadow:0 0 0 2px var(--iodine-soft)}
.linkbtn{border:0;background:none;padding:0 0 0 6px;color:var(--muted);font-size:12.5px;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--ink)}
.warn{color:var(--iodine-text)}
.edit-done{margin-top:6px}
.uploader{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:#FAFBF9;padding:14px}
.dropzone{border:1.5px dashed #B9C6BF;border-radius:10px;padding:30px 16px;text-align:center;background-color:#fff;background-image:radial-gradient(#DCE2DC 1px,transparent 1px);background-size:14px 14px}
.dropzone.over{border-color:var(--iodine);background-color:var(--iodine-soft)}
.dropzone b{display:block;font-size:15px;margin-bottom:4px}
.dropzone.slim{padding:12px 16px;margin-top:10px}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:12px;background:#fff;font-weight:400}
.flist{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.fitem{position:relative;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px}
.fitem .x{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;line-height:1;padding:0;z-index:1}
.fitem small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:5px 2px 3px}
.fitem label{font-size:11.5px;color:var(--muted);display:block;margin:0 2px 2px}
.fitem input[type=date]{width:100%;font:inherit;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 4px;background:#fff;color:var(--ink)}
.upform{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.upform label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:4px}
.upform select{width:100%}
.up-err{color:var(--alert);font-size:12.5px;margin:8px 0 0}
.up-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.thumb-real{width:100%;aspect-ratio:16 / 10;object-fit:cover;border-radius:6px;display:block;background:#1D2624}
.adetail .thumb .thumb-real{aspect-ratio:auto;max-height:340px;object-fit:contain}
.vwrap{position:relative}
.vwrap .dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:0 5px;border-radius:3px;font-variant-numeric:tabular-nums}
.acard.proc{cursor:progress;background:#FFFCF3;border-color:var(--iodine)}
.case-search{width:100%;font:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff;color:var(--ink)}
.case-list{border:1px solid var(--line);border-radius:8px;background:#fff;max-height:210px;overflow:auto;margin-top:6px}
.case-list .cap{font-size:12px;color:var(--muted);padding:6px 10px 2px}
.case-opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:7px 10px;font-size:13px}
.case-opt:hover{background:var(--iodine-soft)}
.case-opt small{color:var(--muted);font-size:12px;white-space:nowrap}
.case-picked{border:1px solid var(--ink);border-radius:8px;background:#fff;padding:8px 10px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.case-picked b{display:block;font-size:14px}
.case-picked .linkbtn{white-space:nowrap;flex:none}
.dept-chips{display:flex;flex-wrap:wrap;gap:6px}
.proc-line{display:block;font-size:12px;color:var(--iodine-text);margin:2px 2px 0}
@media (max-width:880px){ .upform{grid-template-columns:1fr} }
mark.m-alert{background:var(--alert-soft);color:var(--alert);box-shadow:inset 0 -2px 0 var(--alert);padding:0 2px;border-radius:2px}
mark.m-med{background:var(--iodine-soft);color:var(--iodine-text);border-bottom:2px dashed var(--iodine);padding:0 2px}
.m-fixed{background:var(--ok-soft);color:var(--ok);padding:0 2px;border-radius:2px}
.script p.meta-line,.meta-line{display:block;font-size:12.5px;color:var(--muted);margin:0 0 16px;line-height:1.6}
.issue{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.issue.done{background:#F7F9F6}
.issue .rule{font-size:12.5px;font-weight:600;margin-bottom:4px}
.rule.alert{color:var(--alert)} .rule.med{color:var(--iodine-text)} .rule.ok{color:var(--ok)}
.issue p{margin:0 0 8px;font-size:13.5px}
.issue .was{color:var(--muted);text-decoration:line-through}
.sign{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:8px;background:var(--iodine-soft);margin:14px 0;cursor:pointer}
.sign input{margin-top:5px;accent-color:var(--ink)}
.left-count{font-size:13px;color:var(--alert);font-weight:600}
.left-count.clear{color:var(--ok)}

.shoot{display:grid;grid-template-columns:auto minmax(260px,1fr);gap:28px;align-items:start}
.phone{width:300px;height:600px;border-radius:42px;background:#0E1B19;padding:11px;box-shadow:0 24px 40px -24px rgba(23,48,45,.6)}
.cam{position:relative;width:100%;height:100%;border-radius:32px;overflow:hidden;background:radial-gradient(120% 70% at 50% 78%,#3F5650 0%,#1D2C29 58%,#101917 100%)}
.silhouette{position:absolute;left:50%;bottom:-70px;width:250px;height:190px;transform:translateX(-50%);border-radius:50%;background:rgba(255,255,255,.05)}
.face{position:absolute;left:50%;top:64%;width:140px;height:178px;transform:translate(-50%,-50%);border:2px dashed rgba(255,255,255,.32);border-radius:50% 50% 46% 46%}
.prompter{position:absolute;left:0;right:0;top:40px;height:250px;overflow:hidden;padding:0 22px;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 16%,#000 80%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 16%,#000 80%,transparent 100%)}
.prompt-inner{padding:70px 0 220px;color:#fff;font-weight:600;line-height:1.6;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.prompt-inner p{margin:0 0 .7em}
.readline{position:absolute;left:12px;right:12px;top:118px;height:2px;background:var(--iodine);opacity:.9}
.readline::before{content:"";position:absolute;left:-2px;top:-4px;border:5px solid transparent;border-left:7px solid var(--iodine)}
.rec{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:12px;color:#fff;background:rgba(0,0,0,.4);padding:1px 10px;border-radius:999px;font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:center}
.rec .dot{width:8px;height:8px;border-radius:50%;background:#8A9591}
.recording .rec .dot{background:#E5484D}
.recbtn{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:62px;height:62px;border-radius:50%;border:4px solid #fff;background:transparent;padding:0;display:grid;place-items:center}
.recbtn i{display:block;width:44px;height:44px;border-radius:50%;background:#E5484D;transition:all .18s}
.recording .recbtn i{width:22px;height:22px;border-radius:5px}
.qr-wrap{display:flex;gap:16px;align-items:center}
.qr{display:grid;grid-template-columns:repeat(21,1fr);width:120px;height:120px;padding:6px;background:#fff;border:1px solid var(--line);flex:none}
.qr i.on{background:var(--ink)}
.ctrl{display:grid;grid-template-columns:70px 1fr 36px;gap:10px;align-items:center;font-size:13px;margin-bottom:6px}
.ctrl input{accent-color:var(--ink);width:100%}
.ctrl output{color:var(--muted);font-variant-numeric:tabular-nums}

.tl-ruler{display:grid;grid-template-columns:56px 1fr;gap:10px;font-size:11.5px;color:var(--muted);margin-bottom:6px}
.tl-ruler div{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.track{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;margin-bottom:8px}
.track .lab{font-size:12px;color:var(--muted)}
.bar{position:relative;height:32px;background:var(--paper);border-radius:6px;overflow:hidden;display:flex}
.bar > span{display:flex;align-items:center;padding-left:6px;font-size:11px;white-space:nowrap;overflow:hidden;border-right:1px solid #fff}
.v{background:#A9C3B9;color:var(--ink)}
.cut{background:repeating-linear-gradient(45deg,#EACFC8 0 5px,#F7ECE9 5px 10px);color:var(--alert)}
.sub-b{background:#D6E0DB;color:var(--ink-2)}
.gap{background:transparent}
.music{background:#C9D3E8;color:var(--trend)}
.slot{background:var(--iodine-soft);color:var(--iodine-text);outline:1.5px dashed var(--iodine);outline-offset:-2px}
.checks{list-style:none;padding:0;margin:0}
.checks li{position:relative;padding:6px 0 6px 26px;font-size:13.5px;border-bottom:1px solid var(--line)}
.checks li:last-child{border-bottom:0}
.checks li::before{content:"";position:absolute;left:4px;top:12px;width:9px;height:5px;border-left:2px solid var(--ok);border-bottom:2px solid var(--ok);transform:rotate(-45deg)}
.empty{padding:48px 28px;text-align:center}
.empty p{color:var(--muted);max-width:30em;margin:6px auto 18px}

/* 包装台 */
.design{display:grid;grid-template-columns:240px minmax(0,1fr) 292px;gap:16px;align-items:start}
.inbox{padding:14px}
.ibtn{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;padding:10px 11px;border-radius:9px;margin-bottom:4px}
.ibtn:hover{background:#F7F9F6}
.ibtn[aria-pressed="true"]{border-color:var(--ink);background:#F7F9F6}
.ibtn b{display:block;font-size:14px;line-height:1.45}
.ibtn small{display:block;color:var(--muted);font-size:12px}
.st{display:inline-block;font-size:11.5px;margin-top:5px;padding:0 8px;border-radius:999px;background:var(--paper);color:var(--muted)}
.st.ready{background:var(--iodine-soft);color:var(--iodine-text);font-weight:600}
.canvas{padding:16px 18px 20px;min-height:600px;background-color:#FAFBF9;background-image:radial-gradient(#D5DCD5 1px,transparent 1px);background-size:18px 18px}
.canvas-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.canvas-head h2{font-size:17px;margin:0}
.canvas-head p{margin:0;font-size:12.5px;color:var(--muted)}
.notice{margin-top:14px;padding:10px 14px;border-radius:8px;background:var(--iodine-soft);color:var(--iodine-text);font-size:13px}
.cands{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.cand{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:left}
.cand[aria-pressed="true"]{border-color:var(--iodine);box-shadow:0 0 0 2px var(--iodine)}
.cand svg{width:100%;height:auto;display:block;border-radius:6px}
.cap{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:8px}
.cap .rv{color:var(--iodine-text);font-weight:600}
.canvas-empty{margin:70px auto 0;max-width:24em;text-align:center;color:var(--muted)}
.loading{margin:90px auto 0;text-align:center;color:var(--muted)}
.tools{padding:16px 16px 18px}
.tmpl{display:flex;justify-content:space-between;align-items:center;width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:none;text-align:left}
.tmpl[aria-pressed="true"]{border-color:var(--ink);background:#F7F9F6;font-weight:600}
.tmpl .chip{font-weight:400}
select,textarea{width:100%;font:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink)}
textarea{min-height:88px;resize:vertical;line-height:1.6}
.swatches{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sw{width:22px;height:22px;border-radius:6px;border:1px solid rgba(0,0,0,.08)}
.lock{font-size:12px;color:var(--muted);margin-left:auto}
.brandrow{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:6px}
.tools .btn{width:100%;margin-top:8px}

/* 架构 */
.arch{display:flex;flex-direction:column;gap:10px}
.layer{display:grid;grid-template-columns:156px minmax(0,1fr);gap:14px;padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.lname strong{display:block;font-size:15px}
.lname span{font-size:12.5px;color:var(--muted);display:block}
.lname em{font-style:normal;display:inline-block;margin-top:6px;font-size:12px;padding:0 8px;border-radius:999px;background:var(--paper);color:var(--ink-2)}
.lrow{display:grid;gap:10px}
.c3{grid-template-columns:repeat(3,minmax(0,1fr))} .c4{grid-template-columns:repeat(4,minmax(0,1fr))} .c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cell{border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:13px;color:var(--ink-2);background:#FAFBF9}
.cell b{display:block;font-size:14px;color:var(--ink);margin-bottom:2px}
.cell.p1{border-color:var(--iodine);background:#FFFCF3;box-shadow:inset 0 0 0 1px var(--iodine)}
.cell.later{border-style:dashed;background:transparent;color:var(--muted)}
.p1tag{font-size:11px;background:var(--iodine);color:var(--ink);border-radius:999px;padding:0 7px;margin-left:6px;font-weight:600;vertical-align:1px}
.pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.pipe .cell{position:relative}
.pipe .cell:not(:last-child)::after{content:"";position:absolute;right:-12px;top:50%;width:8px;height:8px;border-top:2px solid var(--muted);border-right:2px solid var(--muted);transform:translateY(-50%) rotate(45deg)}
.legend{display:flex;gap:16px;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:20px}
.note{padding:16px 18px}
.note h4{margin:0 0 6px;font-size:14.5px}
.note p{margin:0;font-size:13.5px;color:var(--ink-2)}

/* 资产库 */
.assets{display:block;min-width:0}
.ingest{padding:16px 18px;margin-bottom:14px}
.ingest-top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.ingest-top b{display:block;font-size:14.5px}
.pipeline{list-style:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:0;margin:14px 0 0}
.pipeline li{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--muted);background:#FAFBF9;line-height:1.5;transition:background .2s,border-color .2s}
.pipeline li b{display:block;color:var(--ink);font-size:13px}
.pipeline li.active{border-color:var(--iodine);background:var(--iodine-soft);color:var(--iodine-text)}
.pipeline li.done{border-color:transparent;background:var(--ok-soft);color:var(--ok)}
.pipeline li.done b{color:var(--ok)}
.filters select{width:auto;margin-left:auto;padding:3px 8px;font-size:13px}
.filters.second select{margin-left:0}
.filters input[type=date]{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:3px 8px;background:#fff;color:var(--ink)}
.filters .err{font-size:12.5px;color:var(--alert)}
.filters .count{margin-left:auto;font-size:12.5px;color:var(--muted)}
.time-note{font-size:12.5px;color:var(--muted)}
.fbtn .n{margin-left:5px;font-size:12px;font-variant-numeric:tabular-nums}
.sub-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.sub-row .lab{font-size:12.5px;color:var(--muted);margin-right:4px}
.path{display:block;font-size:12px;color:var(--ink-2);margin-bottom:1px}
.detail .path{margin-top:10px}
@media (max-width:1100px){ .topics,.assets{grid-template-columns:1fr} .detail{position:static} }
.agrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.acard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 8px 10px;text-align:left}

.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag-x{display:inline-flex;align-items:center;gap:2px;font-size:12.5px;padding:1px 3px 1px 10px;border-radius:999px;background:var(--paper);border:0}

.topic-filter{display:flex;align-items:center;gap:8px;font-size:13px;background:var(--iodine-soft);color:var(--iodine-text);padding:6px 8px 6px 12px;border-radius:8px;margin-bottom:10px}
.t-status small{display:block;font-size:12px;text-align:right;color:var(--iodine-text);font-weight:400}
.t-status small.ok{color:var(--ok)}
.resbox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.resbox div{border-radius:8px;padding:9px 12px;font-size:13px;background:var(--ok-soft);color:var(--ok);line-height:1.5}

.resbox b{display:block;font-size:12px;font-weight:600}
.clips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:10px}
.clip{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 8px 10px}
.clip b{display:block;font-size:13px;margin:6px 2px 0}

.seq{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;margin-top:10px}
.shot{flex:0 0 168px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px}
.shot.hole{border:1.5px dashed var(--iodine);background:var(--iodine-soft);color:var(--iodine-text);display:flex;align-items:center}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:all .2s;max-width:90vw}

function addFiles(list){

  if(S.upStep>=0){ toast('上一批还在入库，完成后再传'); return; }

  const errs=[];
  for(const f of list){

    if(S.up.files.length>=20){ errs.push('一次最多 20 个，其余的请分批上传'); break; }
    const ext=(name.split('.').pop()||'').toLowerCase();
    if(!OK_TYPES[f.type]){ errs.push((ext==='heic'||ext==='heif') ? `“${name}”是 HEIC 格式，原型预览不了，请先转成 JPG` : `“${name}”的格式暂不支持，请上传 JPG、PNG、WEBP 或 MP4、MOV`); continue; }
    if(f.size>200*1024*1024){ errs.push(`“${name}”超过 200MB，请压缩后再传`); continue; }
    const item={name, kind:OK_TYPES[f.type], url:URL.createObjectURL(f), shot:localDate(f.lastModified||Date.now())};
    if(item.kind==='视频'){ const v=document.createElement('video'); v.preload='metadata'; v.onloadedmetadata=()=>{ item.dur=v.duration; if(S.page==='assets'&&S.upOpen) render(); }; v.src=item.url; }
    S.up.files.push(item);

}
function submitUpload(){
  const u=S.up;
  const c=CASE_LIST.find(x=>x.id===u.caseId);
  if(!c){ u.err='先选拍的是哪个病例，专科和病种要从病例里带出'; return render(); }
  const dept=u.dept||c.dept, matched=TOPICS.filter(t=>t.disease===c.disease);
  const pet=[c.pet, c.species, c.breed];
  const ids=[];
  u.files.forEach(f=>{
    const id='u'+(S.uSeq++); ids.push(id);
    ASSETS.unshift({id, type:f.kind, title:`${c.name}（${c.breed}）${f.kind}，${md(f.shot)}`, fileName:f.name, dur:f.dur?fmtDur(f.dur):undefined,
      src:ME_SRC[S.role], by:ME[S.role], shot:f.shot, pet:c.pet, petName:c.breed, caseId:c.id, dept, disease:c.disease, url:f.url, uploaded:true, mockProc:true,

      desens:[], view:'可以公开', topics:matched.map(t=>t.id)});
  });
  S.up=null; S.upOpen=false; Object.assign(S,{aType:'全部',aAuth:'all',aDept:'all',aTime:'all',aTopic:null,aMine:false});
  S.upStep=0; render();
  const tick=()=>{
    S.upStep++;
    ids.forEach(id=>{ const a=ASSETS.find(x=>x.id===id); if(a) a.procStep=Math.min(S.upStep,3); });
    if(S.upStep>=UP_STEPS.length){
      ids.forEach(id=>{ const a=ASSETS.find(x=>x.id===id); if(a) a.status='ready'; });
      S.upStep=-1; S.aSel=ids[0];

      if(S.page==='assets') render(); return;
    }
    if(S.page==='assets') render();
    setTimeout(tick,650);
  };
  setTimeout(tick,650);
}

function matchTopic(text, attach){
  if(attach) return TOPICS.find(t=>t.id==='t1');
  let best=null, score=0;
  for(const t of TOPICS){ const kws=KW[t.id]; if(!kws) continue; const sc=kws.filter(k=>text.includes(k)).length; if(sc>score){ score=sc; best=t; } }
  return best;
}

function pickAngle(i){

function scan(){
  const out=[];
  S.script.forEach((txt,sec)=>{
    const taken=[];
    RULES.forEach((r,ri)=>{
      let from=0, i;
      while((i=txt.indexOf(r.find,from))>-1){
        const end=i+r.find.length;
        if(!taken.some(([a,b])=>i<b&&end>a)){ taken.push([i,end]); out.push({sec,start:i,end,ri}); }
        from=end;
      }
    });
  });
  return out;
}
function secHTML(sec){
  const txt=S.script[sec], marks=[];
  scan().filter(m=>m.sec===sec).forEach(m=>marks.push({start:m.start,end:m.end,cls:RULES[m.ri].kind==='alert'?'m-alert':'m-med'}));
  Object.keys(S.fixedIds).forEach(ri=>{ const f=RULES[ri].fix; let from=0,i;
    while((i=txt.indexOf(f,from))>-1){ const end=i+f.length; if(!marks.some(x=>i<x.end&&end>x.start)) marks.push({start:i,end,cls:'m-fixed'}); from=end; } });
  marks.sort((a,b)=>a.start-b.start);
  let out='', pos=0;
  marks.forEach(m=>{ out+=esc(txt.slice(pos,m.start)); const tag=m.cls==='m-fixed'?'span':'mark'; out+=`<${tag} class="${m.cls}">${esc(txt.slice(m.start,m.end))}</${tag}>`; pos=m.end; });
  return out+esc(txt.slice(pos));
}

function qrHTML(){
  let s=7, cells='';
  const rnd=()=> (s = (s*9301+49297)%233280)/233280;
  const finder=(r,c)=>{ for(const [R,C] of [[0,0],[0,14],[14,0]]){ const y=r-R,x=c-C; if(y>=0&&y<7&&x>=0&&x<7) return (y===0||y===6||x===0||x===6||(y>1&&y<5&&x>1&&x<5)); } return null; };
  for(let r=0;r<21;r++) for(let c=0;c<21;c++){ const f=finder(r,c); cells += `<i class="${(f===null? rnd()>.52 : f)?'on':''}"></i>`; }
  return `<div class="qr" aria-label="示意二维码">${cells}</div>`;
}

function fmt(s){ s=Math.floor(s); return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }

let raf=null, last=0;
function setupPrompter(){
  const inner=$('#promptInner'); if(inner) inner.style.fontSize=S.font+'px';
  if(S.recording){ last=performance.now(); cancelAnimationFrame(raf); raf=requestAnimationFrame(tick); }
}
function tick(now){
  const el=$('#prompter'); if(!el||!S.recording) return;
  const dt=Math.min(now-last,64); last=now;
  el.scrollTop += S.speed*0.012*dt;
  S.secs += dt/1000;
  const rt=$('#recTime'); if(rt) rt.textContent=fmt(S.secs);
  if(el.scrollTop + el.clientHeight >= el.scrollHeight - 1){ setRecording(false); toast('念完了。可以去粗剪，也可以从头再来一遍'); return; }
  raf=requestAnimationFrame(tick);
}
function setRecording(on){
  S.recording=on;
  const cam=$('#cam'); if(cam) cam.classList.toggle('recording',on);
  const b=document.querySelector('.recbtn'); if(b) b.setAttribute('aria-label', on?'暂停录制':'开始录制');
  if(on){ S.recorded=true; const d=$('#doneShoot'); if(d) d.disabled=false; last=performance.now(); raf=requestAnimationFrame(tick); }
  else cancelAnimationFrame(raf);
}

document.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b || b.disabled) return;
  const d = b.dataset;
  if(d.nav){ if(S.recording) setRecording(false); if(S.page==='brand')captureBrandDraft(); document.body.classList.remove('hipaw-full'); S.page=d.nav; if(d.nav==='designer')S.dType='科普插图'; location.hash=d.nav; return render(); }
  if(d.role){
    S.role=d.role;
    if(d.role==='nurse' && (S.page==='vet'||S.page==='designer')) S.page='assets';
    else if(S.page==='vet' && d.role==='designer') S.page='designer';
    else if(S.page==='designer' && d.role==='vet') S.page='vet';
    if(d.role==='designer') S.aMine=false;
    if(S.recording) setRecording(false);
    return render();
  }
  if(d.filter){ S.filter=d.filter; const l=TOPICS.filter(t=>S.filter==='all'||t.src===S.filter); if(!l.find(t=>t.id===S.sel)) S.sel=l[0].id; return render(); }
  if(d.sel){ S.sel=d.sel; return render(); }
  if(d.scene){ const sc=SCENES[+d.scene]; if(sc[2]==='pool'){ S.page='topics'; return render(); } if(sc[2]==='case'){ S.cAttach=true; S.cPrompt=''; } else S.cPrompt=sc[2]; S.cErr=false; return render(); }
  if(d.angle){ return pickAngle(+d.angle); }
  if(d.dept){ S.dept=d.dept; S.disease='all'; return render(); }
  if(d.disease){ S.disease=d.disease; return render(); }
  if(d.step){ if(S.recording) setRecording(false); S.step=+d.step; return render(); }
  if(d.go){ if(S.recording) setRecording(false); S.step=+d.go; S.maxStep=Math.max(S.maxStep,S.step); return render(); }
  if(d.opt){ S[d.opt]=d.val; if(d.opt==='dType'){ S.gen=false; S.pick=null; } return render(); }
  if(d.fixm){ const [sec,start,ri]=d.fixm.split('|').map(Number); const r=RULES[ri]; const t=S.script[sec];
    if(t.slice(start,start+r.find.length)===r.find){ S.script[sec]=t.slice(0,start)+r.fix+t.slice(start+r.find.length); S.fixedIds[ri]=true; scriptChanged(); }
    return render(); }
  if(d.unfixr){ const r=RULES[+d.unfixr]; const sec=S.script.findIndex(t=>t.includes(r.fix)); if(sec>-1){ S.script[sec]=S.script[sec].replace(r.fix, r.find); scriptChanged(); } delete S.fixedIds[d.unfixr]; return render(); }
  if(d.pickcase){ const c=CASE_LIST.find(x=>x.id===d.pickcase); S.up.caseId=c.id; S.up.dept=c.dept; S.up.err=''; return render(); }
  if(d.updept){ S.up.dept=d.updept; return render(); }
  if(d.rmfile){ const i=+d.rmfile, f=S.up.files[i]; if(f) URL.revokeObjectURL(f.url); S.up.files.splice(i,1); S.up.err=''; return render(); }
  if(d.editsec){ S.editing=+d.editsec; return render(); }
  if(d.task){ S.task=d.task; S.gen=false; S.pick=null; return render(); }
  if(d.cand){ S.pick=d.cand; return render(); }
  if(d.afilter){ S.aType=d.afilter; return render(); }
  if(d.asel) return openAssetModal(d.asel,b);
  if(d.goasset){ S.page='assets'; S.aSel=d.goasset; S.aTopic=null; S.aType='全部'; S.aAuth='all'; S.aDept='all'; S.aTime='all'; S.aMine=false; render(); return openAssetModal(d.goasset,document.querySelector(`[data-asel="${d.goasset}"]`)); }
  if(d.seltopic){ S.page='topics'; S.sel=d.seltopic; S.filter='all'; S.dept='all'; S.disease='all'; return render(); }
  if(d.rmtag){
    const [id,i]=d.rmtag.split('|'); ASSETS.find(x=>x.id===id).tags.splice(+i,1);
    if($('#assetModal').open){
      updateAssetModal(false);
      const tags=$('#assetModalInfo').querySelectorAll('[data-rmtag]');
      const next=tags[Math.min(+i,tags.length-1)] || $('#assetModal').querySelector('[data-act="closeAsset"]');
      next.focus({preventScroll:true}); return;
    }
    return render();
  }
  if(d.tmpl){ if(d.tmpl!=='cat-uri'){ toast('原型里只画了猫泌尿系统这一套模板'); return; } S.tmpl=d.tmpl; return render(); }
  switch(d.act){
    case 'closeAsset': return closeAssetModal();
    case 'prevAsset': return moveAssetModal(-1);
    case 'nextAsset': return moveAssetModal(1);
    case 'claim': {
      const t=TOPICS.find(x=>x.id===S.sel); t.status='claimed'; t.owner='王医生';
      if(t.id==='t1'){ S.page='vet'; S.step=1; S.maxStep=Math.max(S.maxStep,1); }
      else toast('已认领。原型里只做了“公猫尿闭”这一条完整流程');
      return render();
    }
    case 'goVet': if(S.page==='topics' && S.sel!=='t1'){ toast('原型里只做了“公猫尿闭”这一条完整流程'); return; } S.page='vet'; return render();
    case 'attach': S.cAttach=!S.cAttach; S.cErr=false; return render();
    case 'ask': return askAgent();
    case 'notThis': S.chat.match=null; S.chat.rejected=true; return render();
    case 'upload': if(S.role==='designer'){ toast('原始素材由护士或兽医上传，设计师在这里查看和取用'); return; }
      S.upOpen=!S.upOpen; if(S.upOpen && !S.up) S.up={files:[],pet:'',topic:'',err:''}; return render();
    case 'pick': { const fi=document.getElementById('fileIn'); if(fi) fi.click(); return; }
    case 'cancelUp': if(S.up) S.up.files.forEach(f=>URL.revokeObjectURL(f.url)); S.up=null; S.upOpen=false; return render();
    case 'submitUp': return submitUpload();
    case 'changeCase': S.up.caseId=''; S.up.dept=''; return render();
    case 'toggleMine': S.aMine=!S.aMine; return render();
    case 'seeAssets': { S.aTopic=S.sel; S.aType='全部'; S.aAuth='all'; S.aTime='all'; S.aMine=false; S.aDept='all'; S.page='assets'; const l=assetList(); if(l.length) S.aSel=l[0].id; return render(); }
    case 'clearTopic': S.aTopic=null; return render();
    case 'toDesign': {
      const map={t1:'d1',t2:'d2',t6:'d4'}; const k=map[S.sel];
      if(!k){ toast('这个选题还没人拍口播，暂时没有要包装的东西'); return; }
      S.task=k; S.gen=false; S.pick=null; S.page='designer'; return render();
    }
    case 'gen': S.step=2; S.maxStep=Math.max(S.maxStep,2); return render();
    case 'regen': toast('原型里只准备了一版脚本'); return;
    case 'resetScript': S.script=SCRIPT_AI.map(x=>x[1]); S.fixedIds={}; scriptChanged(); toast('已恢复为 AI 原稿'); return render();
    case 'doneEdit': S.editing=null; return render();
    case 'rec': return setRecording(!S.recording);
    case 'restart': { setRecording(false); S.secs=0; const p=$('#prompter'); if(p) p.scrollTop=0; const rt=$('#recTime'); if(rt) rt.textContent=fmt(0); return; }
    case 'handoff': S.handed=true; S.step=6; S.maxStep=6; toast('已交给设计师小林'); return render();
    case 'asDesigner': S.role='designer'; S.page='designer'; S.task='d1'; S.gen=false; S.pick=null; return render();
    case 'generate': S.generating=true; S.pick=null; render(); setTimeout(()=>{ S.generating=false; S.gen=true; render(); }, 700); return;
    case 'sendReview': S.sent[S.pick]=true; toast('已送王医生审核，审过才能放进视频'); return render();
    case 'deliver': toast('已放进交付区'); return;
  }
});
document.addEventListener('change', e=>{
  const el=e.target;
  if(el.dataset.case){ S.cases[el.dataset.case]=el.checked; return; }
  if(el.id==='medOk'){ S.medOk=el.checked; return render(); }
  if(el.id==='fileIn'){ const fs=[...el.files]; el.value=''; if(fs.length) addFiles(fs); return; }
  if(el.id==='aDept'){ S.aDept=el.value; return render(); }
  if(el.id==='upTopic'){ S.up.topic=el.value; return; }
  if(el.classList && el.classList.contains('fdate')){ S.up.files[+el.dataset.i].shot=el.value||TODAY; return; }
  if(el.id==='tSrc'){ S.filter=el.value; return render(); }
  if(el.id==='aAuth'){ S.aAuth=el.value; return render(); }
  if(el.id==='aTime'){ S.aTime=el.value; return render(); }
  if(el.id==='aFrom'){ S.aFrom=el.value; return render(); }
  if(el.id==='aTo'){ S.aTo=el.value; return render(); }
  if(el.id==='model'){ S.model=el.value; if(S.gen) render(); return; }
});
document.addEventListener('input', e=>{
  const el=e.target;
  if(el.classList && el.classList.contains('sec-edit')){
    const i=+el.dataset.sec; S.script[i]=el.value; autosize(el); scriptChanged();
    const rl=document.getElementById('readLine'); if(rl) rl.innerHTML=readLine();
    const em=document.getElementById('ed'+i); if(em) em.textContent=isEdited(i)?'已修改':'';
    const ec=document.getElementById('edCount'); if(ec){ const n=editedCount(); ec.textContent=n?`你改了 ${n} 段。`:''; }
    const ab=document.getElementById('altBtn'); if(ab){ const n=editedCount(); ab.dataset.act=n?'resetScript':'regen'; ab.textContent=n?'恢复 AI 原稿':'重新生成'; }
  }
  if(el.id==='upQ'){ S.up.q=el.value; const cl=document.getElementById('caseList'); if(cl) cl.innerHTML=caseListHTML(); }
  if(el.id==='cPrompt'){ S.cPrompt=el.value; if(S.cErr){ S.cErr=false; const er=document.querySelector('.send-err'); if(er) er.remove(); } }
  if(el.id==='spd'){ S.speed=+el.value; $('#spdOut').textContent=el.value; }
  if(el.id==='fs'){ S.font=+el.value; $('#fsOut').textContent=el.value; const i=$('#promptInner'); if(i) i.style.fontSize=el.value+'px'; }
});

document.addEventListener('paste', e=>{
  if(S.page!=='assets' || $('#assetModal').open) return;
  const fs=[...((e.clipboardData&&e.clipboardData.files)||[])];
  if(!fs.length) return;
  e.preventDefault(); addFiles(fs);
});
function setDrag(on){ if(S.drag===on) return; S.drag=on; const dz=document.getElementById('dropzone'); if(dz) dz.classList.toggle('over',on); }
document.addEventListener('dragover', e=>{ if(S.page!=='assets' || $('#assetModal').open || !e.dataTransfer || ![...e.dataTransfer.types].includes('Files')) return; e.preventDefault(); if(e.target.closest && e.target.closest('.uploader')) setDrag(true); });
document.addEventListener('dragleave', e=>{ if(S.page==='assets' && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.uploader'))) setDrag(false); });
document.addEventListener('drop', e=>{ if(S.page!=='assets' || $('#assetModal').open || !e.dataTransfer || !e.dataTransfer.files.length) return; e.preventDefault(); setDrag(false); addFiles([...e.dataTransfer.files]); });

const assetDialog=$('#assetModal');
assetDialog.addEventListener('cancel',e=>{e.preventDefault();closeAssetModal();});
let assetBackdropPressed=false;
function outsideAssetDialog(e){
  const r=assetDialog.getBoundingClientRect();
  return e.target===assetDialog && (e.clientX<r.left || e.clientX>r.right || e.clientY<r.top || e.clientY>r.bottom);
}
assetDialog.addEventListener('pointerdown',e=>{assetBackdropPressed=outsideAssetDialog(e);});
assetDialog.addEventListener('click',e=>{if(assetBackdropPressed && outsideAssetDialog(e)) closeAssetModal();assetBackdropPressed=false;});
startHiPaw();
</script>
</body>
</html>
